  min_part_load_fischer_tropsch: 0.9

  # ------------------- INDUSTRY OPTIONS -------------------

  industry_util_factor: 0.7

  efficiency_heat_oil_to_elec: 0.9
  efficiency_heat_biomass_to_elec: 0.9
  efficiency_heat_gas_to_elec: 0.9

  # ------------------- POWERPLANTS OPTIONS -------------------

  conventional_generation: # generator : carrier
    OCGT: gas
    CCGT: gas
    oil: oil
    coal: coal
    lignite: lignite
    biomass: biomass
  keep_existing_capacities: false

  marginal_cost_storage: 0

solving:
  options:
    formulation: kirchhoff
    load_shedding: 1 # Set to "false" or willingness to pay in €/kWh, e.g. 100 €/kWh (intersect between macroeconomic and surveybased willingness to pay https://doi.org/10.3389/fenrg.2015.00055)
    transmission_losses: 2 # Number of piecewise-linear segments approximating I^2R line losses (loss = r_pu_eff * flow^2). 0 = lossless (previous default). NOT a flat loss percentage -- the effective loss fraction is r_pu_eff * flow, so it varies per line and per hour with loading.
    noisy_costs: true
    min_iterations: 4
    max_iterations: 6
    clip_p_max_pu: 0.01
    skip_iterations: false
    track_iterations: false
    # nhours: 10

  # Used only by scripts/solve_redispatch_network.py (stage-2 UC redispatch),
  # never by stage-1 capacity expansion -- rolling-horizon isn't a coherent
  # way to make a single annual investment decision, since it would re-decide
  # extendable capacity independently in every window. horizon/overlap here
  # are in snapshots (hours, at this config's 1h resolution). Validated
  # manually at these values: 61 windows, all solved to optimality, ~53 min
  # total, versus the monolithic full-year UC MILP not finishing its root LP
  # relaxation within a 30-minute time limit.
  redispatch_rolling_horizon:
    horizon: 168 # 1 week
    overlap: 24 # 1 day -- shared tail between consecutive windows, so the next window can revise it with better foresight instead of each window being solved once and never revisited

  solver:
    name: gurobi
    options: gurobi-default

  solver_options:
    highs-default:
      # refer to https://ergo-code.github.io/HiGHS/dev/options/definitions/
      threads: 4
      solver: "ipm"
      run_crossover: "on"
      small_matrix_value: 1e-6
      large_matrix_value: 1e15
      primal_feasibility_tolerance: 1e-6
      dual_feasibility_tolerance: 1e-6
      ipm_optimality_tolerance: 1e-6
      parallel: "on"
      random_seed: 123
    gurobi-default:
      threads: 4
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-6
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
    gurobi-numeric-focus:
      NumericFocus: 3 # Favour numeric stability over speed
      method: 2 # barrier
      crossover: 0 # do not use crossover
      BarHomogeneous: 1 # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-4
      OptimalityTol: 1.e-4
      ObjScale: -0.5
      threads: 8
      Seed: 123
    gurobi-fallback: # Use gurobi defaults
      crossover: 0
      method: 2 # barrier
      BarHomogeneous: 1 # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-5
      OptimalityTol: 1.e-5
      Seed: 123
      threads: 8
    cplex-default:
      threads: 4
      lpmethod: 4 # barrier
      solutiontype: 2 # non basic solution, ie no crossover
      barrier.convergetol: 1.e-5
      feasopt.tolerance: 1.e-6
    copt-default:
      Threads: 8
      LpMethod: 2
      Crossover: 0
    cbc-default: {} # Used in CI
    glpk-default: {} # Used in CI

  mem: 30000 #memory in MB; 20 GB enough for 50+B+I+H2; 100 GB for 181+B+I+H2


