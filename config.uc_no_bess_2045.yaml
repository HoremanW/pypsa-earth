version: 0.8.0
tutorial: false

logging:
  level: INFO
  format: "%(levelname)s:%(name)s:%(message)s"

results_dir: results/
summary_dir: results/

foresight: overnight # myopic, perfect, or overnight


countries: ["SN"]
# Can be replaced by country ["NG", "BJ"], continent ["Africa"] or user-specific region, see more at https://pypsa-earth.readthedocs.io/en/latest/user-guide/configuration/#top-level-configuration

enable:
  retrieve_databundle: false #  Recommended 'true', for the first run. Otherwise data might be missing.
  retrieve_databundle_sector: false
  retrieve_cost_data: true # true: retrieves cost data from technology data and saves in resources/costs.csv, false: uses cost data in data/costs.csv
  retrieve_cutout: false # true: retrieves cutout from atlite and saves in resources/cutouts, false: uses cutout in data/cutouts
  download_osm_data: false # If 'true', OpenStreetMap data will be downloaded for the above given countries
  download_global_buildings: false # If 'true', GlobalMLBuildingFootprints data will be downloaded for the above given countries
  build_natura_raster: false # If 'true', then an exclusion raster will be build. Otherwise use pregenerated raster.
  build_cutout: false # If 'true', then the cutout will be build. Otherwise use pregenerated cutout. Note that the cutout is built according to the `snapshots` date range and `countries` selection.
  # If "build_cutout" : true, then environmental data is extracted according to `snapshots` date range and `countries`
  # requires cds API key https://cds.climate.copernicus.eu/how-to-api
  # More information https://atlite.readthedocs.io/en/latest/introduction.html#datasets
  progress_bar: true # show progress bar during downloading routines and other long-running tasks
  custom_busmap: false # if true, use "data/custom_busmap_elec_s{simpl}_{clusters}.csv" for the clustering instead of the clustering algorithms



custom_rules: ["custom_rules/patch_transmission.smk"] # Default empty [] or link to custom rule file e.g. ["my_folder/my_rules.smk"] that add rules to Snakefile

run:
  name: "uc_no_bess_2045" # use this to keep track of runs with different settings
  sector_name: "uc_no_bess_2045" # use this to keep track of sector scenario runs
  shared_cutouts: true # set to true to share the default cutout(s) across runs
  # Note: value false requires build_cutout to be enabled
  allow_scenario_failure: true # If True, the workflow will continue even if a scenario in run_scnenario fails

scenario:
  simpl: [""]
  ll: ["vopt"]
  clusters: [24]
  opts: [1h]
  planning_horizons: # investment years for myopic and perfect; or costs year for overnight
  - 2045
  sopts:
  - "336seg"
  demand:
  - "AB"

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: "left" # end is not inclusive

# definition of the Coordinate Reference Systems
crs:
  geo_crs: EPSG:4326 # general geographic projection, not used for metric measures. "EPSG:4326" is the standard used by OSM and google maps
  distance_crs: EPSG:3857 # projection for distance measurements only. Possible recommended values are "EPSG:3857" (used by OSM and Google Maps)
  area_crs: ESRI:54009 # projection for area measurements only. Possible recommended values are Global Mollweide "ESRI:54009"

natura: # only relevant when using build_natura_raster: true
  natura_size: countries # countries, cutout, or global. Select which regions to include in the natura raster.
  natura_resolution: 100 # [m] Grid resolution of the natura data.
  window_size: 10000 # [bytes] Size of the shifting rasterization window. The required RAM scales with window_size^2.
  buffer_size: 10000 # [unit of area_crs, default: m] Buffer around the regions of interest to include every required value. A buffer of around 100 km will be sufficient for most cases.

# download_osm_data_nprocesses: 10  # (optional) number of threads used to download osm data

augmented_line_connection:
  add_to_snakefile: True # If True, includes this rule to the workflow
  connectivity_upgrade: 1 # Min. lines connection per node,
  # https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.connectivity.edge_augmentation.k_edge_augmentation.html#networkx.algorithms.connectivity.edge_augmentation.k_edge_augmentation
  new_line_type: ["HVAC"] # Expanded lines can be either ["HVAC"] or ["HVDC"] or both ["HVAC", "HVDC"]
  min_expansion: 1 # [MW] New created line expands by float/int input
  min_DC_length: 600 # [km] Minimum line length of DC line

cluster_options:
  simplify_network:
    to_substations: false # network is simplified to nodes with positive or negative power injection (i.e. substations or offwind connections)
    algorithm: kmeans # choose from: [hac, kmeans]
    feature: solar+onwind-time # only for hac. choose from: [solar+onwind-time, solar+onwind-cap, solar-time, solar-cap, solar+offwind-cap] etc.
    exclude_carriers: []
    remove_stubs: false
    remove_stubs_across_borders: false
    p_threshold_drop_isolated: 0 # [MW] isolated (sub)networks or nodes are being discarded if total mean power is below the specified threshold
    p_threshold_merge_isolated: 0 # [MW] isolated (sub)networks or nodes are being merged into a single isolated bus if total mean power is below the specified threshold
    s_threshold_fetch_isolated: false # [-] a share of the national load for merging an isolated network into a backbone network
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
  alternative_clustering: False # "False" use Voronoi shapes, "True" use GADM shapes
  distribute_cluster: ["load"] # Distributes cluster nodes per country according to ['load'],['pop'] or ['gdp']
  out_logging: true # When "True", logging is printed to console
  aggregation_strategies:
    generators: # use "min" for more conservative assumptions
      p_nom: sum
      p_nom_max: sum
      p_nom_min: sum
      p_min_pu: mean
      p_max_pu: weighted_average
      marginal_cost: mean
      committable: any
      ramp_limit_up: max
      ramp_limit_down: max
      min_up_time: max # not pypsa's own default ("consense", i.e. requires exact agreement) -- extendable generators (min_up_time=0, schema default) and existing ones (min_up_time set by the costs.committable block above) share a bus+carrier and get merged during clustering, so an exact-agreement strategy hard-crashes here. max mirrors the existing conservative choice for ramp_limit_up/down.
      min_down_time: max # same reasoning as min_up_time
      start_up_cost: mean # same reasoning as marginal_cost below
      efficiency: mean
      build_year: mean
      lifetime: mean
    one_ports: # storage units and loads
      StorageUnit:
        build_year: mean
        lifetime: mean
  focus_weights: false # When a value specified, set the share of nodes allocated to each country
    # country: share

build_shape_options:
  gadm_layer_id: 1 # GADM level area used for the gadm_shapes. Codes are country-dependent but roughly: 0: country, 1: region/county-like, 2: municipality-like
  simplify_tolerance: 0.01 # Default value is 0.01, higher the value more is the simplification of the GADM shapes
  simplify_gadm: true # When true, shape polygons are simplified else no
  minarea: 0.01 # Minimum area of polygons to be retained in GADM shapes after simplification, in square degrees. Polygons with area smaller than this value will be removed
  update_file: false # When true, all the input files are downloaded again and replace the existing files
  out_logging: true # When true, logging is printed to console
  year: 2020 # reference year used to derive shapes, info on population and info on GDP
  nprocesses: 3 # number of processes to be used in build_shapes
  worldpop_method: "standard" # "standard" pulls from web 1kmx1km raster, "api" pulls from API 100mx100m raster,
  # false (not "false") no pop addition to shape which is useful when generating only cutout
  gdp_method: "standard" # "standard" pulls from web 1x1km raster, false (not "false") no gdp addition to shape which useful when generating only cutout
  contended_flag: "set_by_country" # "set_by_country" assigns the contended areas to the countries according to the GADM database, "drop" drops these contended areas from the model

subregion:
  method: false # method to define subregions, either "gadm" or "custom", false to not use subregions.
  apply_on: ["simplify_network", "cluster_network"] # apply subregion on the simplify_network and/or cluster_network rule.
  define_by_gadm: false # name of the subregion. Multiple countries can be part in the same subregion.
  path_custom_shapes: false # provide the specific absolute path of the custom file e.g. (...\data\custom_shapes.geojson)
  path_custom_offshore: false # (optional) provide the specific absolute path of the custom offshore file e.g. (...\data\custom_offshore.geojson)
  tolerance: 100 # Buffer distance (in km) for assigning a country/subregion shape to a bus (the default tolerance is 100 km)

clean_osm_data_options: # osm = OpenStreetMap
  names_by_shapes: true # Set the country name based on the extended country shapes
  threshold_voltage: 51000 # [V] minimum voltage threshold to keep the asset (cable, line, generator, etc.) [V]
  tag_substation: "transmission" # Filters only substations with 'transmission' tag, ('distribution' also available)
  add_line_endings: true # When "True", then line endings are added to the dataset of the substations
  generator_name_method: OSM # Methodology to specify the name to the generator. Options: OSM (name as by OSM dataset), closest_city (name by the closest city)
  use_custom_lines: "OSM_only" # Use OSM (OSM_only), customized (custom_only), both data sets (add_custom) or none (none)
  path_custom_lines: false # If exists, provide the specific absolute path of the custom file e.g. (...\data\custom_lines.geojson)
  use_custom_substations: "OSM_only" # Use OSM (OSM_only), customized (custom_only), both data sets (add_custom) or none (none)
  path_custom_substations: false # If exists, provide the specific absolute path of the custom file e.g. (...\data\custom_substations.geojson)
  use_custom_cables: "OSM_only" # Use OSM (OSM_only), customized (custom_only), both data sets (add_custom) or none (none)
  path_custom_cables: false # If exists, provide the specific absolute path of the custom file e.g. (...\data\custom_cables.geojson)

build_osm_network: # Options of the build_osm_network script; osm = OpenStreetMap
  group_close_buses: true # When "True", close buses are merged and guarantee the voltage matching among line endings
  group_tolerance_buses: 5000 # [m] (default 5000) Tolerance in meters of the close buses to merge
  split_overpassing_lines: true # When True, lines overpassing buses are splitted and connected to the bueses
  overpassing_lines_tolerance: 1 # [m] (default 1) Tolerance to identify lines overpassing buses
  force_ac: false # When true, it forces all components (lines and substation) to be AC-only. To be used if DC assets create problem.

base_network:
  min_voltage_substation_offshore: 51000 # [V] minimum voltage of the offshore substations
  min_voltage_rebase_voltage: 51000 # [V] minimum voltage in base network

# DemandCast and GEGIS are two available options
# DemandCast covers 2000-2024
# GEGIS dataset provides data for 2011, 2013, 2018
# Details and comparison are provided in
# https://github.com/pypsa-meets-earth/pypsa-earth/issues/1724
load_options:
  source: "gegis" # "demcast" or "gegis"
  weather_year: 2013 # Weather year of the load profile
  prediction_year: 2045 # Valid only if "gegis" used as a source
  scale: 1 # scales all load time-series, i.e. 2 = doubles load

co2_budget:     #check!!!!!!!!!!!!!!!!
  enable: false
  override_co2opt: true
  co2base_value: co2limit # choose from: [co2limit, co2base, absolute, {float}]
  year:
    2020: 1.0
    2025: 0.85
    2030: 0.70
    2035: 0.55
    2040: 0.40
    2045: 0.25
    2050: 0.1

electricity:
  base_voltage: 225. # Senegal's actual transmission backbone -- verified against raw base.nc: 225kV carries 88.5% of line thermal capacity and 92.4% of line length vs the 90kV secondary layer; 380kV doesn't exist in Senegal's real grid data.
  voltages: [90., 132., 220., 225., 300., 380., 500., 750.]
  co2limit: 7.75e+7 # European default, 0.05 * 3.1e9*0.5, needs to be adjusted for Africa
  co2base: 1.487e+9 # European default, adjustment to Africa necessary
  agg_p_nom_limits: # enables to set country-wise maximum and minimum generation capacities for generators (e.g. renewables, nuclear, and geothermal)
    file: data/agg_p_nom_minmax.csv # path to csv file containing country-wise generation capacity limits
    include_existing: false # false: only new built capacities are constrained; true: existing capacities are accounted in the constraints
  hvdc_as_lines: false # should HVDC lines be modeled as `Line` or as `Link` component?
  automatic_emission: false
  automatic_emission_base_year: 1990 # 1990 is taken as default. Any year from 1970 to 2018 can be selected.

  operational_reserve: # like https://genxproject.github.io/GenX.jl/stable/Model_Reference/core/#Operational-Reserves
    activate: false
    epsilon_load: 0.02 # share of total load
    epsilon_vres: 0.02 # share of total renewable supply
    contingency: 0 # fixed capacity in MW

  max_hours:
    battery: 8
    H2: 168

  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT, oil, coal, biomass]          # was: [solar, onwind, offwind-ac, offwind-dc, OCGT]
    StorageUnit: []
    Store: []              # no_bess: was [battery]
    Link: []

  powerplants_filter: (DateOut >= 2045 or DateOut != DateOut) and (DateIn <= 2045 or DateIn != DateIn)
  custom_powerplants: false #  "false" use only powerplantmatching (ppm) data, "merge" combines ppm and custom powerplants, "replace" use only custom powerplants

  conventional_carriers: [oil, OCGT, CCGT, coal, biomass]
  renewable_carriers: [solar, onwind, hydro]

  estimate_renewable_capacities:
    stats: "irena" # False, = greenfield expansion, 'irena' uses IRENA stats to add expansion limits
    year: 2023 # Reference year, available years for IRENA stats are 2000 to 2023
    p_nom_min: 1 # any float, scales the minimum expansion acquired from stats, i.e. 110% of <years>'s capacities => p_nom_min: 1.1
    p_nom_max: false # sets the expansion constraint, False to deactivate this option and use estimated renewable potentials determine by the workflow, float scales the p_nom_min factor accordingly
    technology_mapping:
      # Wind is the Fueltype in ppm.data.Capacity_stats, onwind, offwind-{ac,dc} the carrier in PyPSA-Earth
      Offshore: []
      Onshore: [onwind]
      PV: [solar]

lines:
  ac_types:
    132.: "243-AL1/39-ST1A 20.0"
    220.: "Al/St 240/40 2-bundle 220.0"
    225.: "Al/St 240/40 2-bundle 220.0" # no dedicated 225kV entry exists in pypsa's own line-type library; 220kV is the closest standard class and electrically equivalent.
    300.: "Al/St 240/40 3-bundle 300.0"
    380.: "Al/St 240/40 4-bundle 380.0"
    500.: "Al/St 240/40 4-bundle 380.0"
    750.: "Al/St 560/50 4-bundle 750.0"
  dc_types:
    500.: "HVDC XLPE 1000"
  s_max_pu: 0.7
  s_nom_max: 100000 # [MW] large-but-finite, not .inf: pypsa's loss approximation (solving.options.transmission_losses) needs a finite bound to build its piecewise-linear segments against, and raises a hard error otherwise once lines are extendable (ll: vopt). 100 GW is far beyond anything this system could ever economically build (peak demand is on the order of 1-2 GW), so it's "unbounded" in every practical sense without breaking the loss constraint.
  s_nom_max_min: -.inf
  length_factor: 1.25
  under_construction: "zero" # 'zero': set capacity to zero, 'remove': remove, 'keep': with full capacity

links:
  p_max_pu: 1.0
  p_nom_max: .inf
  p_nom_max_min: -.inf
  under_construction: "zero" # 'zero': set capacity to zero, 'remove': remove, 'keep': with full capacity

transformers:
  x: 0.1
  s_nom: 2000.
  type: ""

atlite:
  nprocesses: 4
  cutouts:
    cutout-2013-era5:
      module: era5
      dx: 0.25 # cutout resolution
      dy: 0.25 # cutout resolution
      # The cutout time is automatically set by the snapshot range. See `snapshot:` option above and 'build_cutout.py'.
      # time: ["2013-01-01", "2014-01-01"]  # to manually specify a different weather year (~70 years available)
      # The cutout spatial extent [x,y] is automatically set by country selection. See `countires:` option above and 'build_cutout.py'.
      # x: [-12., 35.]  # set cutout range manual, instead of automatic by boundaries of country
      # y: [33., 72]    # manual set cutout range
      x: [-20.9, -10.7]
      y: [8.7, 17.3]
  default: cutout-2013-era5

renewable:
  onwind:
    cutout: auto
    resource:
      method: wind
      turbine: Vestas_V112_3MW
    capacity_per_sqkm: 3 # conservative, ScholzPhd Tab 4.3.1: 10MW/km^2
    # correction_factor: 0.93
    copernicus:
      # Scholz, Y. (2012). Renewable energy based electricity supply at low costs:
      #  development of the REMix model and application for Europe. ( p.42 / p.28)
      # CLC grid codes:
      # 11X/12X - Various forest types
      # 20  - Shrubs
      # 30  - Herbaceus vegetation
      # 40  - Cropland
      # 50  - Urban
      # 60  - Bare / Sparse vegetation
      # 80  - Permanent water bodies
      # 100 - Moss and lichen
      # 200 - Open sea
      grid_codes: [20, 30, 40, 60, 100, 111, 112, 113, 114, 115, 116, 121, 122, 123, 124, 125, 126]
      distance: 1000
      distance_grid_codes: [50]
    natura: true
    potential: simple # or conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  solar:
    cutout: auto
    resource:
      method: pv
      panel: CSi
      orientation: latitude_optimal # will lead into optimal design
      # slope: 0.  # slope: 0 represent a flat panel
      # azimuth: 180.  # azimuth: 180 south orientation
    capacity_per_sqkm: 4.6 # From 1.7 to 4.6 addresses issue #361
    # Determined by comparing uncorrected area-weighted full-load hours to those
    # published in Supplementary Data to
    # Pietzcker, Robert Carl, et al. "Using the sun to decarbonize the power
    # sector: The economic potential of photovoltaics and concentrating solar
    # power." Applied Energy 135 (2014): 704-720.
    correction_factor: 0.854337
    copernicus:
      grid_codes: [20, 30, 40, 50, 60, 90, 100]
    natura: true
    potential: simple # or conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  hydro:
    cutout: auto
    hydrobasins_level: 6
    resource:
      method: hydro
      hydrobasins: data/hydrobasins/hybas_world.shp
      flowspeed: 1.0 # m/s
      # weight_with_height: false
      # show_progress: true
    carriers: [hydro]
    PHS_max_hours: 6
    hydro_max_hours: "energy_capacity_totals_by_country" # not active
    hydro_max_hours_default: 6.0 # (optional, default 6) Default value of max_hours for hydro when NaN values are found
    clip_min_inflow: 1.0
    extendable: false
    normalization:
      method: false # 'hydro_capacities' to rescale country hydro production by using hydro_capacities, 'eia' or 'irena' to rescale by eia or irena data, false for no rescaling
     # use the weather year for weather-dominated variations (installed capacity is changing slowly)
     # the technology-year for policy-determined changes (installed capacity is changing quickly)
      year: 2023 # (optional) year of statistics used to rescale the runoff time series. When not provided, the cutout weather year is used
    multiplier: 1.1 # multiplier applied after the normalization of the hydro production; default 1.0
    hydro_min_inflow_pu: 1.0 # [hour] A threshold of energy to power ratio to classify hydro powerplants as reservoirs in case type is missed
  csp:
    cutout: auto
    resource:
      method: csp
      installation: SAM_solar_tower
    capacity_per_sqkm: 2.392 # From 1.7 to 4.6 addresses issue #361
    # Determined by comparing uncorrected area-weighted full-load hours to those
    # published in Supplementary Data to
    # Pietzcker, Robert Carl, et al. "Using the sun to decarbonize the power
    # sector: The economic potential of photovoltaics and concentrating solar
    # power." Applied Energy 135 (2014): 704-720.
    copernicus:
      grid_codes: [20, 30, 40, 60, 90]
      distancing_codes: [50]
      distance_to_codes: 3000
    natura: true
    potential: simple # or conservative
    clip_p_max_pu: 1.e-2
    extendable: true
    csp_model: advanced # simple or advanced

# TODO: Needs to be adjusted for Africa.
# Costs Configuration
costs:
  year: 2045 # cost file selection, i.e. costs_2030.csv in this case; reference year for costs is always 2020
  technology_data_version: v0.13.2
  discountrate: [0.07] #, 0.086, 0.111]
  country_specific_data: "" # (optional) Reference to the desired technology-data directory for techno-economic input data; Only "" and "US" supported, for other values check the technology-data output directory
  # Only needed if "US" is selected as `country_specific_data`, otherwise ignore
  cost_scenario: "moderate" # only used if `country_specific_data: "US"`; can be "moderate", "advanced" or "conservative"
  financial_case: "market" # only used if `country_specific_data: "US"`; can be "market" or "r&d"
  # Management of output currencies and exchange rates
  output_currency: "EUR" # full list of supported currencies at https://github.com/alexprengere/currencyconverter/blob/master/currency_converter/eurofxref.csv
  default_exchange_rate: 0.7532 # previously USD2013_to_EUR2013; should be sufficient as current data from 'technology-data` are either in EUR or USD; [EUR/USD] ECB: https://www.ecb.europa.eu/stats/exchange/eurofxref/html/eurofxref-graph-usd.en.html
  future_exchange_rate_strategy: "reference" # reference uses the exchange rate from `reference_year` for all conversions, ensuring all costs are expressed in the same currency and year; "latest" uses the yearly average of the latest available exchange rates for the selected `output_currency`; "custom" allows to specify a `custom_future_exchange_rate` below
  custom_future_exchange_rate: None # if `future_exchange_rate_strategy: "custom"`, please insert here the desired output_currency-to-EUR exchange rate
  rooftop_share: 0.14 # based on the potentials, assuming (0.1 kW/m2 and 10 m2/person)
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.07
  marginal_cost: # EUR/MWh
    solar: 0.01
    onwind: 0.015
    offwind: 0.015
    hydro: 0.
    H2: 0.
    electrolysis: 0.
    fuel cell: 0.
    battery: 0.
    battery inverter: 0.
  emission_prices: # in currency per tonne emission, only used with the option Ep
    co2: 0.
  investment: # EUR/MW (or EUR/MWh for storage-energy technologies)
    # BESS CapEx recalibrated to Ember's Oct-2025 real-world "rest of world" (excl.
    # China/US) project data ($125/kWh combined, 4h+ systems), rather than the raw
    # DEA/technology-data catalogue figure -- independent benchmarking (NREL mid case,
    # Ember) showed the DEA figure running 14-42% above real current market prices.
    # Split into inverter/storage using this model's own DEA-implied power/energy cost
    # ratio, applied to Ember's total. Year-specific -- matches this config's year (2045).
    battery inverter: 55206
    battery storage: 58311
  FOM: # %/year -- Ember "How cheap is battery storage?" (Dec 2025), ~2% of capex, routine
    # maintenance/monitoring/performance-guarantee only -- Ember explicitly excludes
    # augmentation/degradation from this figure (unlike NREL's 4%, which bundles a
    # degradation allowance into FOM). Flat percentage, not year-specific.
    battery inverter: 2.0
    battery storage: 2.0
  VOM: # EUR/MWh -- degradation/cycle-aging cost, applied only on "battery inverter" (routed
    # through to the discharger Link and, via process_cost_data.py, to the existing-battery
    # StorageUnit's marginal_cost -- both apply it once per MWh actually discharged, not
    # per MWh cycled through both legs). NOT set on "battery storage": nothing in this
    # pipeline reads that field for cost application (Store.marginal_cost is deliberately
    # hardcoded to 0 in add_extra_components.py -- see the signed-p note there), so a value
    # here would be inert. Formula: storage capex (Ember-anchored, EUR/MWh) / cycle_life
    # (5000 cycles to 80% SOH, mid of the 4000-6000 real-world grid-scale LFP range).
    # Year-specific -- matches this config's year (2045).
    battery inverter: 11.66
  efficiency: # per unit -- round-trip. DEA's "battery inverter" value (0.96) only covers
    # the inverter/PCS's own AC-DC-AC conversion loss, not the whole system: NREL "Cost
    # Projections for Utility-Scale Battery Storage: 2025 Update" (Cole et al. 2025)
    # explicitly defines round-trip efficiency to include "losses associated with cooling
    # systems or battery control equipment" and selects 85%, stating it's "well aligned with
    # published values". Overriding here replaces the inverter-only figure with this
    # whole-system one, for both the existing (StorageUnit, via the "battery" derived row)
    # and new-build (Store+Link charger/discharger, sqrt-split) representations -- both now
    # read this same source. Flat, not year-specific: NREL doesn't project this rising, and
    # inverter-only efficiency is already close to its physical ceiling (see BESS
    # efficiency-trend discussion), though the whole-system figure has more headroom than
    # the inverter-only one did -- no sourced trajectory found for that, so left flat.
    battery inverter: 0.85
  # investment: # EUR/MW
  #   CCGT: 830000
  # FOM: # %/year
  #   CCGT: 3.35
  # VOM: # EUR/MWh
  #   CCGT: 4.2
  fuel: # EUR/MWh_th. "gas" inherits to both CCGT and OCGT automatically
    # (costs.at["OCGT","fuel"] = costs.at["gas","fuel"] etc. in process_cost_data.py, applied
    # after this override), so overriding "gas" alone is sufficient for both carriers. Oil
    # deliberately NOT overridden here -- checked against both a global benchmark (Rotterdam
    # HSFO) and a Senegal-specific figure (the government's own gas-to-power strategy note,
    # which cites $14/MMBtu HFO as its fossil comparator) and the existing technology-data
    # default (43.6-52.9 depending on year) already sits between the two, no correction needed.
    #
    # gas: Senegal's future gas supply is domestic (GTA/Sangomar) and piped, not
    # internationally-traded LNG -- so a European/Asian hub benchmark (TTF/JKM) is the wrong
    # comparison, and is additionally distorted right now by an active Gulf LNG supply
    # disruption. Used instead: Senegal's own "Gas to Power" strategy note (Ministry of
    # Petroleum and Energy), which cites $5-6/MMBtu domestic gas -- converted at the midpoint,
    # ~EUR16.25/MWh_th (vs. the previous technology-data default of ~28.4 EUR/MWh_th for 2030,
    # which was itself backfilled from a 2010-vintage DIW figure, not a current benchmark).
    gas: 16.25
    # coal: technology-data's default (7.8, declining to 6.7 by 2050, DIW/IEA-2011-vintage) is
    # roughly half the current international benchmark. No landed Senegal-specific price found
    # (Sendou's coal is imported); used API2 Rotterdam (~$120/t, Aug 2026, 6,000 kcal/kg NAR =
    # 25.1 GJ/t) as the best available proxy, without a further shipping/import premium (not
    # quantified). Coal was never built in any solved network in this project's model
    # comparisons to date, so this is a correctness fix, not expected to move dispatch results.
    coal: 14.9
    # biomass: technology-data's default (9.35, flat since IEA 2011b, over a decade old) is
    # far below even the cheapest current biomass benchmark found. Deliberately NOT set to the
    # EU wood-pellet market benchmark (37-64 EUR/MWh_th) -- Senegal's dominant available
    # feedstock (groundnut shell, 700,000-900,000 t/year in the groundnut basin) is a
    # near-waste agricultural residue, not commercially-traded wood pellets, a different market
    # entirely. Used the low end of the EU agricultural-residue range (Lamers et al. 2015,
    # already cited in the project's UTS Africa Power Report; EUR4/GJ ~ EUR14.4/MWh_th) as a
    # conservative proxy -- plausibly still an overstatement of true near-waste feedstock cost,
    # flagged as a real data gap (no Senegal/groundnut-shell-specific EUR/GJ figure available).
    # Biomass was never built in any solved network to date, so also a correctness fix, not
    # expected to move dispatch results.
    biomass: 14.4
  # fuel: # EUR/MWh
  #   gas: 10.1
  # lifetime: # years
  #   CCGT: 25.0
  # efficiency: # per unit
  #   CCGT: 0.58

  # --- Unit commitment overrides -----------------------------------------------------
  # Not present in any technology-data source (checked directly: zero UC-related columns
  # in the resolved cost tables), so these only exist via this override. Applied only to
  # the existing/non-extendable fleet in attach_conventional_generators() -- pypsa disallows
  # committable=True together with p_nom_extendable=True, and OCGT/CCGT/coal/oil are all in
  # electricity.extendable_carriers.Generator, so new-build capacity of these carriers stays
  # continuous/non-committable regardless of this section.
  # biomass INCLUDED: CO2 intensity for this carrier is unset in the raw cost data and falls
  # back to fill_values.CO2 intensity: 0 above, i.e. this model already treats biomass as
  # zero-CO2 -- meaning it's the only dispatchable thermal carrier that stays unaffected if
  # a CO2 budget/price is ever turned on (currently both are disabled), so its dispatch
  # profile could shift a lot under that scenario. Worth having real UC behaviour for it now.
  #
  # min_load / ramp_rate / OCGT & coal values: Agora Energiewende (2017), "Flexibility in
  # thermal power plants", Table 1 ("most commonly used" tier, not the state-of-the-art
  # tier -- more representative of Senegal's fleet), https://www.agora-energiewende.de/
  # fileadmin/Projekte/2017/Flexibility_in_thermal_plants/115_flexibility-report-WEB.pdf
  # min_load / ramp_rate / start-up time for biomass: Danish Energy Agency, "Technology Data
  # for Generation of Electricity and District Heating", Ch.09 "Biomass CHP and HOP plants",
  # datasheet "Medium Straw CHP, 80 MW feed" (p.168), https://ens.dk/sites/ens.dk/files/
  # Statistik/technology_data_catalogue_for_el_and_dh_-_0009.pdf -- same DEA catalogue family
  # already used for this carrier's capex/efficiency/lifetime elsewhere in the cost data.
  # Straw CHP used as a representative solid-biomass steam-cycle proxy (Senegal's actual
  # biomass fuel, e.g. groundnut shells/bagasse, differs, but flexibility characteristics at
  # this scale are driven mainly by steam-cycle class, not fuel type specifically).
  # min_up_time/min_down_time for OCGT/coal/biomass are NOT the same metric as the cited
  # "start-up time" (time to bring a unit online) -- they're a modelling proxy derived from
  # it (operators avoid re-cycling a unit shortly after a costly start), not a direct
  # citation of that specific parameter. Biomass is the one exception where the DEA figures
  # (2h warm / 8h cold) are used directly as-is, since they're already clean round numbers.
  # start_up_cost_per_mw remains the weakest-sourced figure for OCGT/coal/oil/biomass -- see
  # BESS_UC_Input_Values.xlsx for the full citation trail and why the best identified
  # source for OCGT/coal (NREL/SR-5500-55433) couldn't be pulled directly in this
  # environment, and why no start-up cost is reported for biomass in the DEA catalogue at all.
  # CCGT and oil sourcing unchanged from before (Energies 17(1):51 2024; Wartsila product
  # literature respectively) -- see Excel sheet for exact citations.
  committable:
    OCGT: true
    CCGT: true
    coal: true
    oil: true
    biomass: true
  p_min_pu: # per unit of p_nom
    OCGT: 0.45 # Agora Table 1, "most commonly used" OCGT: 40-50% -> midpoint
    CCGT: 0.5
    coal: 0.4 # Agora Table 1, "most commonly used" hard coal: 25-40% -> upper (more conservative) end
    oil: 0.15
    biomass: 0.4 # DEA "Medium Straw CHP, 80 MW feed": minimum load 40% of full load
  ramp_limit_up: # per unit of p_nom, per snapshot (1h here) -- NOT %/min
    OCGT: 1.0 # Agora Table 1: 8-12%/min ("most commonly used") -> x60 = 480-720%/hr -> unconstrained at 1h
    CCGT: 0.6
    coal: 0.9 # Agora Table 1: 1.5-4%/min ("most commonly used") -> x60 = 90-240%/hr -> low end used, capped at 1.0
    oil: 1.0 # Wartsila-type HFO/diesel engines, full load in ~2 min -> unconstrained at 1h
    biomass: 1.0 # DEA: 4%/min secondary regulation -> x60 = 240%/hr -> unconstrained at 1h, capped at 1.0
  ramp_limit_down: # mirrors ramp_limit_up; no separate down-ramp research done
    OCGT: 1.0
    CCGT: 0.6
    coal: 0.9
    oil: 1.0
    biomass: 1.0
  min_up_time: # number of snapshots (=hours at 1h resolution); see proxy note above
    OCGT: 1 # Agora Table 1 hot/cold start-up time: 5-11 min -> floored to this model's 1h resolution
    CCGT: 8
    coal: 4 # proxy from Agora Table 1 hot start-up time: 2.5-3h
    oil: 0
    biomass: 2 # DEA "Medium Straw CHP, 80 MW feed": warm start-up time, used directly (already a clean round hour figure)
  min_down_time:
    OCGT: 1
    CCGT: 11
    coal: 6 # proxy from Agora Table 1 cold start-up time: 5-10h (lower-middle of range)
    oil: 0
    biomass: 8 # DEA "Medium Straw CHP, 80 MW feed": cold start-up time, used directly
  start_up_cost_per_mw: # currency/MW -- scaled by each generator's p_nom in add_electricity.py
    OCGT: 40 # weakest-sourced figure in this block -- see BESS_UC_Input_Values.xlsx
    CCGT: 130
    biomass: 80 # NOT reported in the DEA catalogue for biomass -- assumed comparable to coal
    # (similar steam-cycle class) at a modest discount for typically smaller unit sizes. Weakest-sourced figure for this carrier.
    coal: 100 # weakest-sourced figure in this block -- see BESS_UC_Input_Values.xlsx
    oil: 20
  # --- end unit commitment overrides -------------------------------------------------

  lines:
    length_factor: 1.25 #to estimate offwind connection costs


monte_carlo:
  # Description: Specify Monte Carlo sampling options for uncertainty analysis.
  # Define the option list for Monte Carlo sampling.
  # Make sure add_to_snakefile is set to true to enable Monte-Carlo
  options:
    add_to_snakefile: false # When set to true, enables Monte Carlo sampling
    samples: 9 # number of optimizations. Note that number of samples when using scipy has to be the square of a prime number
    sampling_strategy: "chaospy" # "pydoe2", "chaospy", "scipy", packages that are supported
    seed: 42 # set seedling for reproducibilty
  # Uncertanties on any PyPSA object are specified by declaring the specific PyPSA object under the key 'uncertainties'.
  # For each PyPSA object, the 'type' and 'args' keys represent the type of distribution and its argument, respectively.
  # Supported distributions types are uniform, normal, lognormal, triangle, beta and gamma.
  # The arguments of the distribution are passed using the key 'args'  as follows, tailored by distribution type
  # normal: [mean, std], lognormal: [mean, std], uniform: [lower_bound, upper_bound],
  # triangle: [mid_point (between 0 - 1)], beta: [alpha, beta], gamma: [shape, scale]
  # More info on the distributions are documented in the Chaospy reference guide...
  # https://chaospy.readthedocs.io/en/master/reference/distribution/index.html
  # An abstract example is as follows:
  # {pypsa network object, e.g. "loads_t.p_set"}:
  # type: {any supported distribution among the previous: "uniform", "normal", ...}
  # args: {arguments passed as a list depending on the distribution, see the above and more at https://pypsa.readthedocs.io/}
  uncertainties:
    loads_t.p_set:
      type: uniform
      args: [0.5, 1]
    generators_t.p_max_pu.loc[:, n.generators.carrier == "onwind"]:
      type: lognormal
      args: [1.5]
    generators_t.p_max_pu.loc[:, n.generators.carrier == "solar"]:
      type: beta
      args: [0.5, 2]

